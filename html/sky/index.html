<!-- ===== 品牌文本修复脚本 ===== -->
<script>
(function(){
  'use strict';
  try {
    var raw = localStorage.getItem('user_info');
    if (raw) {
      var info = JSON.parse(raw);
      if (info && info.name && info.name.indexOf('苍穹') !== -1) {
        info.name = '饿了吧外卖';
        localStorage.setItem('user_info', JSON.stringify(info));
      }
    }
  } catch(e) {}

  var _setItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value) {
    if ((key === 'user_info' || key === 'userInfo') && value && value.indexOf('苍穹') !== -1) {
      try {
        var v = JSON.parse(value);
        if (v && v.name && v.name.indexOf('苍穹') !== -1) v.name = '饿了吧外卖';
        if (v && v.storeName && v.storeName.indexOf('苍穹') !== -1) v.storeName = '饿了吧外卖';
        value = JSON.stringify(v);
      } catch(e) {}
    }
    return _setItem.call(this, key, value);
  };

  function replaceText(node) {
    if (node.nodeType === 3) {
      if (node.textContent.indexOf('苍穹') !== -1) {
        node.textContent = node.textContent.replace(/苍穹外卖/g, '饿了吧外卖');
      }
    } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
      for (var i = 0; i < node.childNodes.length; i++) {
        replaceText(node.childNodes[i]);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var app = document.getElementById('app');
    if (app) {
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) { replaceText(node); });
        });
      });
      observer.observe(app, { childList: true, subtree: true, characterData: true });
      replaceText(app);
    }
  });
})();
</script>

<script>
(function() {
  // MutationObserver 强制覆盖 Vue 设置的内联样式
  function forceTheme() {
    var menus = document.querySelectorAll('.el-menu');
    for (var i = 0; i < menus.length; i++) {
      var m = menus[i];
      if (m.style.backgroundColor && m.style.backgroundColor !== 'rgb(27, 31, 36)') {
        m.style.setProperty('background-color', '#1B1F24', 'important');
      }
    }
    var sidebars = document.querySelectorAll('.sidebar-container');
    for (var j = 0; j < sidebars.length; j++) {
      sidebars[j].style.setProperty('background', '#1B1F24', 'important');
    }
  }

  var observer = new MutationObserver(function() {
    forceTheme();
  });

  document.addEventListener('DOMContentLoaded', function() {
    var app = document.getElementById('app');
    if (app) {
      observer.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
      // 多次执行确保生效
      setTimeout(forceTheme, 100);
      setTimeout(forceTheme, 500);
      setTimeout(forceTheme, 1500);
      setTimeout(forceTheme, 3000);
    }
  });
})();
</script>

<!-- ===== AI 助理菜单注入 + 主题覆盖 ===== -->
<script>
(function() {
  'use strict';
  var ADDED = false;

  function addMenuItem() {
    if (ADDED) return;
    var ul = document.querySelector('.sidebar-container .el-menu');
    if (!ul) return;
    if (ul.querySelector('.ai-menu')) { ADDED = true; return; }

    var li = document.createElement('li');
    li.className = 'el-menu-item ai-menu';
    li.style.cssText = 'padding-left:20px;cursor:pointer;';
    li.innerHTML = '<i class="iconfont icon-ai-assistant" style="margin-right:8px;font-style:normal;"></i><span>AI助理</span>';

    li.onclick = function() {
      // 尝试 Vue Router，失败则直接跳转
      try {
        var v = document.getElementById('app').__vue__;
        if (v && v.$router) {
          var root = v.$router.options.routes.find(function(r){ return r.path==='/'; });
          if (root) {
            if (!root.name) root.name = '__layout__';
            if (!root.children || !root.children.find(function(c){ return c.path==='ai-assistant'; })) {
              v.$router.addRoute('__layout__', {
                path: 'ai-assistant',
                component: { template: '<iframe src="./ai-assistant.html" style="width:100%;height:calc(100vh-84px);border:none;"></iframe>' },
                meta: { title: 'AI助理', icon: 'icon-ai-assistant' }
              });
            }
            v.$router.push('/ai-assistant').catch(function(){});
            return;
          }
        }
      } catch(e) {}
      window.location.href = '/ai-assistant.html';
    };

    ul.appendChild(li);
    ADDED = true;
  }

  function fixColors() {
    var menus = document.querySelectorAll('.sidebar-container .el-menu');
    for (var i=0; i<menus.length; i++) {
      var s = menus[i].getAttribute('style') || '';
      if (s.indexOf('343744')!==-1 || s.indexOf('rgb(52, 55, 68)')!==-1) {
        menus[i].style.setProperty('background-color', '#1B1F24', 'important');
      }
    }
  }

  // 定时扫描
  setInterval(function(){ fixColors(); addMenuItem(); }, 800);

  // DOM 变化时重扫
  new MutationObserver(function() {
    ADDED = false;
    setTimeout(function(){ fixColors(); addMenuItem(); }, 100);
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
