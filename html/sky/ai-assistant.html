<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 助理 - 饿了吧外卖</title>
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<style>
:root {
  --primary: #E85D3A; --primary-dark: #C4452A; --primary-light: #F08060;
  --accent: #F0A500; --accent-light: #FFC940;
  --page-bg: #F2F0EC; --card-bg: #FFFFFF;
  --text-primary: #2D3436; --text-secondary: #636E72;
  --border: #E8E3DD; --success: #27AE60;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--page-bg); height: 100vh; overflow: hidden;
}

/* 顶部栏 */
.topbar {
  height: 52px; background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px;
  flex-shrink: 0; gap: 12px;
}
.back-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 14px; border-radius: 6px;
  border: 1px solid var(--border); background: #fff;
  color: var(--text-secondary); cursor: pointer;
  font-size: 13px; transition: all .2s; white-space: nowrap;
}
.back-btn:hover { border-color: var(--primary); color: var(--primary); }
.topbar .brand { font-size: 15px; font-weight: 600; color: var(--text-primary); flex: 1; }
.topbar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
.topbar .dot.ok { background: var(--success); }
.topbar .dot.err { background: #f39c12; }

/* 主布局 */
.main-layout { display: flex; flex: 1; height: calc(100vh - 52px); overflow: hidden; }

/* 对话列表 */
.conv-sidebar {
  width: 250px; background: #fff;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.conv-sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); }
.new-conv-btn {
  width: 100%; padding: 8px; border-radius: 6px;
  border: 1.5px dashed var(--border); background: transparent;
  color: var(--text-secondary); cursor: pointer; font-size: 13px;
  transition: all .2s;
}
.new-conv-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(232,93,58,.04); }
.conv-list { flex: 1; overflow-y: auto; padding: 6px; }
.conv-item {
  padding: 10px 12px; margin: 2px 0; border-radius: 6px;
  cursor: pointer; display: flex; align-items: center;
  justify-content: space-between; color: var(--text-secondary);
  font-size: 13px; transition: all .2s;
}
.conv-item:hover { background: var(--page-bg); color: var(--text-primary); }
.conv-item.active { background: rgba(232,93,58,.08); color: var(--primary); font-weight: 500; }
.conv-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-item .del { opacity: 0; color: #bbb; margin-left: 4px; cursor: pointer; }
.conv-item:hover .del { opacity: 1; }
.conv-item .del:hover { color: var(--primary); }

/* 聊天区 */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.message { display: flex; gap: 10px; max-width: 78%; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.ai { align-self: flex-start; }
.message .avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff;
}
.message.user .avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
.message.ai .avatar { background: linear-gradient(135deg, var(--primary-light), var(--primary-dark)); }
.message .bubble {
  padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; word-break: break-word;
}
.message.user .bubble { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; }
.message.ai .bubble { background: #fff; color: var(--text-primary); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.message .tool-badge {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
  background: rgba(240,165,0,.12); color: var(--accent); margin-bottom: 4px;
}
.typing-dots span {
  display: inline-block; width: 6px; height: 6px; background: #ccc; border-radius: 50%;
  animation: typing 1.4s infinite; margin-right: 3px;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes typing { 0%,60%,100% { opacity: .2; } 30% { opacity: 1; } }

.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: #ccc; gap: 12px;
}
.empty-state .icon { font-size: 64px; }
.empty-state .text { font-size: 16px; color: var(--text-secondary); }

.quick-suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 28px 10px; }
.quick-suggestions .chip {
  padding: 6px 14px; background: #fff; border: 1px solid var(--border);
  border-radius: 16px; font-size: 12px; cursor: pointer; color: var(--text-secondary); transition: all .2s;
}
.quick-suggestions .chip:hover { border-color: var(--primary); color: var(--primary); background: rgba(232,93,58,.04); }

.input-area { padding: 14px 28px; background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; }
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-row textarea {
  flex: 1; border: 2px solid var(--border); border-radius: 10px;
  padding: 10px 14px; font-size: 14px; resize: none; outline: none;
  font-family: inherit; min-height: 42px; max-height: 100px;
  background: var(--page-bg); color: var(--text-primary); transition: border-color .2s;
}
.input-row textarea:focus { border-color: var(--primary); background: #fff; }
.send-btn {
  padding: 10px 22px; border-radius: 8px; border: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .25s; white-space: nowrap; box-shadow: 0 2px 10px rgba(232,93,58,.3);
}
.send-btn:hover { box-shadow: 0 4px 16px rgba(232,93,58,.45); transform: translateY(-1px); }
.send-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
.send-btn:disabled:hover { transform: none; }
.input-hint { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }

@media (max-width: 768px) {
  .conv-sidebar { display: none; }
  .chat-messages { padding: 12px; }
  .message { max-width: 92%; }
}
</style>
</head>
<body>

<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <button class="back-btn" @click="goBack">← 返回管理端</button>
    <span class="brand">🤖 AI 智能助理</span>
    <span class="dot" :class="apiReady ? 'ok' : 'err'" :title="apiReady ? '已连接' : '未连接'"></span>
  </header>

  <div class="main-layout">
    <!-- 对话列表 -->
    <aside class="conv-sidebar">
      <div class="conv-sidebar-header">
        <button class="new-conv-btn" @click="newConversation">+ 新建对话</button>
      </div>
      <div class="conv-list">
        <div v-for="c in conversations" :key="c.id"
             class="conv-item" :class="{ active: currentConvId === c.id }"
             @click="switchConversation(c)">
          <span class="title" :title="c.title || '新对话'">{{ c.title || '新对话' }}</span>
          <span class="del" @click.stop="deleteConversation(c.id)">✕</span>
        </div>
        <div v-if="conversations.length===0" style="padding:30px;text-align:center;color:#ccc;font-size:13px;">
          暂无对话
        </div>
      </div>
    </aside>

    <!-- 聊天区 -->
    <section class="chat-area">
      <div class="empty-state" v-if="messages.length===0 && !isStreaming">
        <div class="icon">🤖</div>
        <div class="text">AI 智能助理</div>
      </div>

      <div class="chat-messages" ref="msgBox" v-show="messages.length>0">
        <div v-for="(m, idx) in messages" :key="idx"
             class="message" :class="m.role==='user'?'user':'ai'">
          <div class="avatar">{{ m.role==='user' ? '我' : 'AI' }}</div>
          <div>
            <span class="tool-badge" v-if="m.toolCall">🔍 {{ m.toolCall }}</span>
            <div class="bubble" v-if="m.content" v-html="fmt(m.content)"></div>
            <div class="bubble" v-if="m.isStreaming && !m.content">
              <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="quick-suggestions" v-if="messages.length===0 && !isStreaming">
        <span class="chip" v-for="s in tips" :key="s" @click="send(s)">{{ s }}</span>
      </div>

      <div class="input-area">
        <div class="input-row">
          <textarea v-model="inputMsg" placeholder="输入问题..."
                    rows="1" @keydown.enter.exact.prevent="send(inputMsg)"
                    :disabled="isStreaming" ref="inputBox"></textarea>
          <button class="send-btn" @click="send(inputMsg)"
                  :disabled="isStreaming || !inputMsg.trim()">
            {{ isStreaming ? '···' : '发送' }}
          </button>
        </div>
        <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </section>
  </div>
</div>

<script src="https://unpkg.com/vue@2.7.14/dist/vue.js"></script>
<script>
var API = '/api';

new Vue({
  el: '#app',
  data: {
    conversations: [], currentConvId: null, currentTitle: '',
    messages: [], inputMsg: '', isStreaming: false,
    apiReady: false, token: '', tips: [
      '今天营业额多少？', '最近7天销量Top5',
      '现在有多少待处理订单？', '今天订单完成率？'
    ]
  },
  mounted: function() { this.login(); },
  methods: {

    // ===== 导航 =====
    goBack: function() {
      // 如果在 iframe 中，跳转父窗口
      if (window.self !== window.top) {
        window.parent.location.href = '/';
      } else {
        window.location.href = '/';
      }
    },

    // ===== 登录 =====
    login: function() {
      var self = this;
      fetch(API + '/employee/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: '123456' })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.code === 1) {
          self.token = d.data.token;
          self.apiReady = true;
          self.loadConversations();
        }
      }).catch(function(e) {
        console.error('Login failed:', e);
        self.apiReady = false;
        setTimeout(function() { self.login(); }, 3000);
      });
    },

    // ===== 对话管理 =====
    loadConversations: function() {
      var self = this;
      fetch(API + '/ai/conversations?page=1&pageSize=50', {
        headers: { token: this.token }
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.code === 1) self.conversations = d.data.records || [];
      }).catch(function(e) { console.error(e); });
    },
    newConversation: function() {
      this.currentConvId = null;
      this.currentTitle = '新对话';
      this.messages = [];
      this.inputMsg = '';
      this.$nextTick(function() {
        var b = this.$refs.inputBox;
        if (b) b.focus();
      });
    },
    switchConversation: function(c) {
      this.currentConvId = c.id;
      this.currentTitle = c.title || '对话';
      this.loadMessages(c.id);
    },
    loadMessages: function(cid) {
      var self = this;
      fetch(API + '/ai/conversations/' + cid, {
        headers: { token: this.token }
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.code === 1) {
          self.messages = (d.data.messages || []).map(function(m) {
            return {
              role: m.role === 'user' ? 'user' : 'ai',
              content: self.parseAssistantContent(m),
              isStreaming: false
            };
          });
        }
        self.$nextTick(function() { self.scrollBottom(); });
      }).catch(function(e) { console.error(e); });
    },
    parseAssistantContent: function(m) {
      if (m.role === 'assistant') {
        try {
          var p = JSON.parse(m.content);
          if (p && p.tool_calls) return p.content || '(工具调用)';
        } catch(e) {}
      }
      return m.content;
    },
    deleteConversation: function(cid) {
      if (!confirm('删除这条对话？')) return;
      var self = this;
      fetch(API + '/ai/conversations/' + cid, {
        method: 'DELETE', headers: { token: this.token }
      }).then(function() {
        self.conversations = self.conversations.filter(function(c) { return c.id !== cid; });
        if (self.currentConvId === cid) self.newConversation();
      }).catch(function(e) { console.error(e); });
    },

    // ===== 发送消息（核心） =====
    send: function(text) {
      if (!text || !text.trim() || this.isStreaming) return;
      var msg = text.trim();
      this.inputMsg = '';
      this.isStreaming = true;

      // 添加用户消息
      this.messages.push({ role: 'user', content: msg, isStreaming: false });
      // 添加 AI 占位
      var aiIdx = this.messages.length;
      this.messages.push({ role: 'ai', content: '', isStreaming: true });
      this.$nextTick(this.scrollBottom);

      var self = this;
      fetch(API + '/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', token: this.token },
        body: JSON.stringify({ conversationId: this.currentConvId, message: msg })
      }).then(function(resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return self.readSSE(resp, aiIdx);
      }).catch(function(e) {
        console.error('Chat:', e);
        self.$set(self.messages[aiIdx], 'isStreaming', false);
        self.$set(self.messages[aiIdx], 'content', '❌ ' + e.message);
        self.isStreaming = false;
      });
    },

    // ===== SSE 流读取 =====
    readSSE: async function(resp, aiIdx) {
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var leftover = '';
      var curEvent = '';

      try {
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;

          var text = leftover + decoder.decode(chunk.value, { stream: true });
          var lines = text.split('\n');
          leftover = lines.pop() || '';

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) { curEvent = ''; continue; }
            if (line.startsWith('event:')) {
              curEvent = line.substring(6).trim();
              continue;
            }
            if (!line.startsWith('data:')) continue;
            var data = line.substring(5).trim();
            if (!data) continue;

            if (curEvent === 'text') {
              var newContent = (this.messages[aiIdx].content || '') + data;
              this.$set(this.messages[aiIdx], 'content', newContent);
            } else if (curEvent === 'tool_call') {
              this.$set(this.messages[aiIdx], 'toolCall', data);
            } else if (curEvent === 'tool_result') {
              this.$set(this.messages[aiIdx], 'toolCall', null);
            } else if (curEvent === 'done') {
              try {
                var parsed = JSON.parse(data);
                this.currentConvId = parsed.conversationId;
                this.currentTitle = parsed.title || this.currentTitle;
                this.loadConversations();
              } catch(e2) {}
              this.$set(this.messages[aiIdx], 'isStreaming', false);
              this.isStreaming = false;
              this.$nextTick(this.scrollBottom);
              return;
            } else if (curEvent === 'error') {
              try {
                var err = JSON.parse(data);
                this.$set(this.messages[aiIdx], 'content', '❌ ' + (err.message || '错误'));
              } catch(e2) {
                this.$set(this.messages[aiIdx], 'content', '❌ ' + data);
              }
              this.$set(this.messages[aiIdx], 'isStreaming', false);
              this.isStreaming = false;
              return;
            }
            this.$nextTick(this.scrollBottom);
          }
        }
      } catch(e) {
        this.$set(this.messages[aiIdx], 'content', '❌ 读取中断: ' + e.message);
        this.$set(this.messages[aiIdx], 'isStreaming', false);
        this.isStreaming = false;
        throw e;
      }

      this.$set(this.messages[aiIdx], 'isStreaming', false);
      this.isStreaming = false;
      this.$nextTick(this.scrollBottom);
    },

    scrollBottom: function() {
      var el = this.$refs.msgBox;
      if (el) el.scrollTop = el.scrollHeight;
    },

    fmt: function(c) {
      if (!c) return '';
      return c
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }
  }
});
</script>
</body>
</html>
